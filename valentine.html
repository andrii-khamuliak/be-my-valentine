<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffecd2 100%);
            position: relative;
            height: 100vh;
        }

        /* Animated floating hearts background */
        .heart-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main container */
        #root {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        /* Card styling */
        .valentine-card {
            background: white;
            padding: 60px 70px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 135, 0.3);
            text-align: center;
            position: relative;
            width: 600px;
            min-height: 450px;
            animation: cardAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Decorative hearts on card corners */
        .corner-heart {
            position: absolute;
            font-size: 30px;
            animation: heartBeat 1.5s infinite;
        }

        .corner-heart.top-left {
            top: -15px;
            left: -15px;
        }

        .corner-heart.top-right {
            top: -15px;
            right: -15px;
        }

        .corner-heart.bottom-left {
            bottom: -15px;
            left: -15px;
        }

        .corner-heart.bottom-right {
            bottom: -15px;
            right: -15px;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            10%, 30% {
                transform: scale(1.1);
            }
            20%, 40% {
                transform: scale(1);
            }
        }

        /* Title styling */
        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3em;
            color: #ff6b9d;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(255, 107, 157, 0.2);
            animation: titleFloat 3s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Button container */
        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
            position: relative;
            min-height: 100px;
        }

        /* Button base styling */
        .valentine-button {
            padding: 18px 45px;
            font-size: 1.3em;
            font-weight: 600;
            font-family: 'Quicksand', sans-serif;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .yes-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: absolute;
            left: 50%;
            transform: translateX(-180px);
            z-index: 10;
            transform-origin: center;
            transition: none;
        }

        .yes-button.yes-big {
            animation: balloonGrowFixed 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }
        
        @keyframes balloonGrowFixed {
            0% {
                transform: translateX(-180px) scale(1);
            }
            100% {
                transform: translateX(-180px) scale(1.3);
            }
        }

        .no-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            position: absolute;
            left: 50%;
            transform: translateX(80px);
            transition: left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
            pointer-events: none;
            z-index: 15;
        }

        .no-button:hover {
            box-shadow: 0 12px 30px rgba(245, 87, 108, 0.4);
        }

        /* Success screen */
        .success-screen {
            animation: successAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes successAppear {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .success-title {
            font-family: 'Pacifico', cursive;
            font-size: 4em;
            color: #ff6b9d;
            margin-bottom: 30px;
            animation: successBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes successBounce {
            0% {
                transform: scale(0);
            }
            60% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        .success-emoji {
            font-size: 8em;
            animation: emojiSpin 1s ease-in-out;
        }

        @keyframes emojiSpin {
            0% {
                transform: rotate(0deg) scale(0);
            }
            50% {
                transform: rotate(180deg) scale(1.2);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        .success-message {
            font-size: 1.5em;
            color: #666;
            margin-top: 20px;
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff6b9d;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Floating hearts background -->
    <div class="heart-bg" id="heartBg"></div>
    
    <div id="root"></div>

    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    
    <script>
        // Create floating hearts background
        const heartBg = document.getElementById('heartBg');
        const hearts = ['💕', '💖', '💗', '💝', '💘', '❤️'];
        
        for (let i = 0; i < 15; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 15 + 's';
            heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
            heartBg.appendChild(heart);
        }

        // React App
        const { useState, useRef, useEffect } = React;

        function App() {
            const [stage, setStage] = useState('question');
            const [yesHovered, setYesHovered] = useState(false);
            const noButtonRef = useRef(null);
            const containerRef = useRef(null);

            useEffect(() => {
                if (stage !== 'question') return;

                let isMoving = false;
                const button = noButtonRef.current;
                if (!button) return;

                const handleMouseMove = (e) => {
                    if (!button || !containerRef.current || isMoving) return;

                    const container = containerRef.current;
                    const buttonRect = button.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();

                    // Calculate distance from mouse to button center
                    const buttonCenterX = buttonRect.left + buttonRect.width / 2;
                    const buttonCenterY = buttonRect.top + buttonRect.height / 2;
                    const distance = Math.sqrt(
                        Math.pow(e.clientX - buttonCenterX, 2) + 
                        Math.pow(e.clientY - buttonCenterY, 2)
                    );

                    // If mouse is close to button (within 150px), move it away
                    if (distance < 150) {
                        isMoving = true;

                        const maxX = containerRect.width - buttonRect.width;
                        const maxY = containerRect.height - buttonRect.height;

                        let randomX = Math.random() * maxX;
                        let randomY = Math.random() * maxY;

                        randomX = Math.max(0, Math.min(randomX, maxX));
                        randomY = Math.max(0, Math.min(randomY, maxY));

                        button.style.left = randomX + 'px';
                        button.style.top = randomY + 'px';
                        button.style.transform = 'none';

                        // Prevent rapid movements - shorter delay for faster reaction
                        setTimeout(() => {
                            isMoving = false;
                        }, 300);
                    }
                };

                document.addEventListener('mousemove', handleMouseMove);
                return () => document.removeEventListener('mousemove', handleMouseMove);
            }, [stage]);

            const handleYesClick = () => {
                setStage('yay');
                createConfetti();
            };

            const createConfetti = () => {
                const colors = ['#ff6b9d', '#667eea', '#764ba2', '#f093fb', '#f5576c'];
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        const confetti = document.createElement('div');
                        confetti.className = 'confetti';
                        confetti.style.left = Math.random() * 100 + '%';
                        confetti.style.top = '-10px';
                        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                        confetti.style.animationDelay = Math.random() * 0.5 + 's';
                        document.body.appendChild(confetti);
                        
                        setTimeout(() => confetti.remove(), 3000);
                    }, i * 30);
                }
            };

            return React.createElement(
                'div',
                { className: 'valentine-card' },
                React.createElement('div', { className: 'corner-heart top-left' }, '💕'),
                React.createElement('div', { className: 'corner-heart top-right' }, '💖'),
                React.createElement('div', { className: 'corner-heart bottom-left' }, '💗'),
                React.createElement('div', { className: 'corner-heart bottom-right' }, '💝'),
                
                stage === 'question' && React.createElement(
                    React.Fragment,
                    null,
                    React.createElement('h1', null, 'Гануся, ти будеш моєю валентикою?'),
                    React.createElement(
                        'div',
                        { className: 'button-container', ref: containerRef },
                        React.createElement(
                            'button',
                            {
                                className: 'valentine-button yes-button' + (yesHovered ? ' yes-big' : ''),
                                onClick: handleYesClick,
                                onMouseEnter: () => setYesHovered(true)
                            },
                            'Так 💕'
                        ),
                        React.createElement(
                            'button',
                            {
                                className: 'valentine-button no-button',
                                ref: noButtonRef
                            },
                            'Нє'
                        )
                    )
                ),
                
                stage === 'yay' && React.createElement(
                    'div',
                    { className: 'success-screen' },
                    React.createElement('div', { className: 'success-emoji' }, '💖'),
                    React.createElement('h1', { className: 'success-title' }, 'Неймовірно!'),
                    React.createElement('p', { className: 'success-message' }, 'Я знав, що ти скажеш так! 💕'),
                    React.createElement('img', {
                        src: 'https://media.giphy.com/media/g9582DNuQppxC/giphy.gif',
                        alt: 'Happy celebration',
                        style: {
                            maxWidth: '300px',
                            borderRadius: '15px',
                            marginTop: '30px',
                            boxShadow: '0 10px 30px rgba(0,0,0,0.2)'
                        }
                    })
                )
            );
        }

        const root = document.getElementById('root');
        ReactDOM.render(React.createElement(App, null), root);
    </script>
</body>
</html>
